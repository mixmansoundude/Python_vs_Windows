---
version: 2
updates:
  # This repo pins every action version explicitly in .github/workflows/*.yml
  # (checkout, cache, upload-artifact, etc.) with no automated signal when a
  # pin falls behind. A 2026-07 manual audit said every pin was on its latest
  # major, but several were not; Item 90 bumped them by hand on 2026-10-30.
  # This file is what catches the next drift on its own.
  # github-actions is the only ecosystem configured here on purpose: this repo
  # has no committed requirements.txt/pyproject.toml (CI installs ad-hoc pip
  # packages inline in workflow YAML run: steps, which Dependabot's pip
  # ecosystem has no manifest file to scan), so there is nothing else for
  # Dependabot to track today.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Dependabot rejects a file with an option outside its schema; the old
    # spelling of the next line (no s) did that from 2026-08-17 until
    # 2026-10-31 and nothing was ever opened. tests/test_dependabot_config.py
    # holds every option name to Dependabot's options reference.
    open-pull-requests-limit: 5
    # Held for a reader, for now (maintainer decision 2026-10-31): pr-automerge.yml
    # arms auto-merge for every same-repo pull request without this label, and a
    # bump of an action changes how CI itself runs, so a session reads the runs of
    # each of the first few Dependabot pull requests before merging it. Once they
    # have behaved, delete this labels: block and they merge by themselves when
    # the aggregate check is green (CLAUDE.md, GitHub Actions / CI health).
    labels:
      - "no-automerge"
